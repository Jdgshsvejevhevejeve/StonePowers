name: Build StonePowers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugin
        run: gradle build --no-daemon

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: StonePowers-JAR
          path: build/libs/*.jar

      - name: Package Resource Pack
        run: |
          cd resourcepack
          zip -r ../StonePowers-ResourcePack.zip .

      - name: Upload Resource Pack
        uses: actions/upload-artifact@v4
        with:
          name: StonePowers-ResourcePack
          path: StonePowers-ResourcePack.zip
